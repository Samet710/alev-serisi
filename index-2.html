<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="Tek dosyalık Alev Serisi uygulaması. Günlük serini takip et, alevinin gelişimini izle.">
  <title>Alev Serisi</title>
  <style>
    @property --flame { syntax: "<color>"; inherits: true; initial-value: #36b9ff; }
    @property --flame-mid { syntax: "<color>"; inherits: true; initial-value: #9ae8ff; }
    @property --flame-core { syntax: "<color>"; inherits: true; initial-value: #ffffff; }
    @property --ambient { syntax: "<color>"; inherits: true; initial-value: #168dff; }
    @property --fire-scale { syntax: "<number>"; inherits: true; initial-value: .46; }
    :root {
      color-scheme: dark;
      --bg:#0d0c12; --panel:#191820; --panel-2:#202029; --text:#f4f2f7; --muted:#918c9d;
      --line:#2b2934; --flame:#36b9ff; --flame-mid:#9ae8ff; --flame-core:#ffffff; --ambient:#168dff;
      --fire-scale:.46; --fire-glow:.34; --spark-opacity:.5; --ambient-opacity:.22;
      transition:--ambient 1.5s ease, --flame 1.4s ease, --flame-mid 1.4s ease, --flame-core 1.4s ease;
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--bg); }
    body {
      margin:0; min-height:100vh; color:var(--text); background:#0d0c12; position:relative; isolation:isolate; overflow-x:hidden;
      font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .screen-ambience { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; opacity:var(--ambient-opacity); transition:opacity 1.2s ease; contain:paint; }
    .screen-ambience::before { content:""; position:absolute; inset:-22%; background:
      radial-gradient(ellipse at 50% 38%, color-mix(in srgb,var(--ambient) 57%,transparent) 0%, transparent 48%),
      radial-gradient(ellipse at 50% 70%, color-mix(in srgb,var(--flame) 37%,transparent) 0%, transparent 53%);
      transform:translate3d(0,0,0); transform-origin:center; animation:screen-ambience-breathe 8s ease-in-out infinite; will-change:transform,opacity; }
    .screen-ambience::after { content:""; position:absolute; inset:0; background:
      radial-gradient(ellipse at 50% 43%,color-mix(in srgb,var(--flame) 34%,transparent) 0%,transparent 58%),
      radial-gradient(ellipse at 50% 76%,color-mix(in srgb,var(--ambient) 23%,transparent) 0%,transparent 70%);
      opacity:.13; transition:opacity .25s ease; }
    .app { position:relative; z-index:1; width:min(100%,520px); min-height:100vh; margin:0 auto; padding:calc(22px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
    .app[hidden] { display:none !important; }
    header { display:flex; align-items:center; justify-content:center; min-height:32px; margin-bottom:8px; }
    .brand { font-size:13px; font-weight:800; letter-spacing:.19em; color:#a6a1b4; text-transform:uppercase; }
    .hero { display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:12px; }

    /* Şeffaf SVG + hafif CSS animasyonları. Siyah yüzey/Canvas kullanılmaz. */
    .flame-stage {
      width:100%; height:clamp(240px, 40vh, 310px); position:relative; isolation:isolate;
      display:grid; place-items:center; margin:3px 0 0; overflow:visible; background:transparent !important;
      --stage-boost:1;
    }
    .flame-stage::before {
      content:""; position:absolute; z-index:0; pointer-events:none; inset:1% 0 0;
      background:
        radial-gradient(ellipse at 50% 72%, color-mix(in srgb,var(--ambient) 23%,transparent) 0%, transparent 47%),
        radial-gradient(ellipse at 50% 54%, color-mix(in srgb,var(--flame) 13%,transparent) 0%, transparent 65%);
      opacity:var(--stage-glow,.6); transform:translateZ(0); animation:ambient-breath 5.6s ease-in-out infinite;
    }
    .flame-stage::after {
      content:""; position:absolute; z-index:0; pointer-events:none; width:48%; height:17%; left:26%; bottom:5%;
      border:1px solid color-mix(in srgb,var(--ambient) 29%,transparent); border-top-color:color-mix(in srgb,var(--flame-mid) 42%,transparent);
      border-radius:50%; background:radial-gradient(ellipse, color-mix(in srgb,var(--ambient) 13%,transparent),transparent 70%);
      opacity:var(--halo-opacity,.28); transform:perspective(180px) rotateX(58deg); animation:ground-halo 6s ease-in-out infinite;
    }
    .fire-svg { position:absolute; inset:0; display:block; width:100%; height:100%; overflow:visible; background:transparent !important; z-index:1; pointer-events:none; }
    .fire-scale { transform:scale(var(--fire-scale)); transform-origin:50% 100%; transform-box:fill-box; transition:transform 1.05s cubic-bezier(.18,.78,.22,1); will-change:transform; }
    .flame-waver { transform-origin:50% 100%; transform-box:fill-box; animation:flame-sway 2.7s cubic-bezier(.45,.05,.55,.95) infinite; }
    .outer-stop-base { stop-color:var(--flame); transition:stop-color 1.45s ease; }
    .outer-stop-mid { stop-color:var(--flame-mid); transition:stop-color 1.45s ease; }
    .outer-stop-tip { stop-color:var(--flame-mid); transition:stop-color 1.45s ease; }
    .inner-stop-base { stop-color:var(--flame-mid); transition:stop-color 1.45s ease; }
    .inner-stop-hot { stop-color:var(--flame-core); transition:stop-color 1.45s ease; }
    .flame-outer { fill:url(#outerGradient); }
    .flame-left { fill:url(#innerGradient); opacity:.86; transform-box:fill-box; transform-origin:50% 100%; animation:lick-left 2.35s cubic-bezier(.45,.05,.55,.95) infinite; }
    .flame-right { fill:url(#innerGradient); opacity:.76; transform-box:fill-box; transform-origin:50% 100%; animation:lick-right 2.75s cubic-bezier(.45,.05,.55,.95) infinite; }
    .flame-middle { fill:url(#middleGradient); opacity:.92; transform-box:fill-box; transform-origin:50% 100%; animation:lick-middle 1.95s cubic-bezier(.45,.05,.55,.95) infinite; }
    .flame-core { fill:url(#coreGradient); opacity:.9; transform-box:fill-box; transform-origin:50% 100%; animation:core-flicker 1.65s ease-in-out infinite; }
    .flame-hotspot { fill:#fff; opacity:.58; transform-box:fill-box; transform-origin:center; animation:hotspot 2.15s ease-in-out infinite; }
    .spark { fill:var(--flame-mid); opacity:0; transform-box:fill-box; transform-origin:center; animation:ember-rise var(--duration,2.4s) ease-out var(--delay,0s) infinite; transition:fill 1.4s ease; }
    .spark:nth-of-type(2n) { fill:var(--flame-core); }
    .flame-stage[data-theme="blue"] .spark { fill:#baf5ff; }
    body[data-theme="blue"] .screen-ambience::before { animation-name:screen-ambience-breathe; }
    body[data-theme="orange"] .screen-ambience::before { animation-name:golden-bloom; }
    body[data-theme="red"] .screen-ambience::before { animation-name:red-ambient; }
    body[data-theme="white"] .screen-ambience::before { animation-name:white-aura; }
    body[data-theme="purple"] .screen-ambience::before { animation-name:violet-ambient; }
    .flame-stage[data-theme="orange"] .spark { fill:#ffe0a4; animation-duration:1.9s; }
    .flame-stage[data-theme="red"]::before { animation-name:red-ambient; }
    .flame-stage[data-theme="red"] .spark { fill:#ff9aa7; animation-duration:1.7s; }
    .flame-stage[data-theme="white"]::after { border-style:dashed; }
    .flame-stage[data-theme="white"] .spark { fill:#fff; animation-duration:2.8s; }
    .flame-stage[data-theme="purple"]::before { animation-name:violet-ambient; }
    .flame-stage[data-theme="purple"]::after { border-style:dotted; animation-duration:4.2s; }
    .flame-stage[data-theme="emerald"]::before { animation-name:emerald-bloom; }
    .flame-stage[data-theme="emerald"] .spark { fill:#b9ffe7; animation-duration:2.25s; }
    .flame-stage[data-theme="gold"]::before { animation-name:golden-bloom; }
    .flame-stage[data-theme="gold"] .spark { fill:#fff0a8; animation-duration:1.8s; }
    .flame-stage[data-theme="pink"]::before { animation-name:pink-drift; }
    .flame-stage[data-theme="pink"] .spark { fill:#ffd1f3; animation-duration:2.15s; }
    .flame-stage[data-theme="turquoise"]::before { animation-name:turquoise-wave; }
    .flame-stage[data-theme="turquoise"]::after { border-style:double; }
    .flame-stage[data-theme="turquoise"] .spark { fill:#c1fff5; animation-duration:2.55s; }
    .flame-stage[data-theme="lime"]::before { animation-name:lime-pulse; }
    .flame-stage[data-theme="lime"] .spark { fill:#f0ffb2; animation-duration:1.8s; }
    .flame-stage[data-level="spark"] .flame-waver { animation-duration:3.3s; }
    .flame-stage[data-level="ember"] .flame-waver { animation-duration:2.9s; }
    .flame-stage[data-level="blaze"] .flame-waver { animation-duration:2.6s; }
    .flame-stage[data-level="inferno"] .flame-waver { animation-duration:2.35s; }
    .flame-stage[data-level="legend"] .flame-waver { animation-duration:2.12s; }
    .flame-stage[data-level="blaze"] .flame-hotspot, .flame-stage[data-level="inferno"] .flame-hotspot, .flame-stage[data-level="legend"] .flame-hotspot { opacity:.78; }
    .flame-stage[data-level="legend"] .flame-hotspot { animation-duration:1.45s; }
    body[data-theme="gold"] .screen-ambience::before { animation-name:golden-bloom; }
    body[data-theme="pink"] .screen-ambience::before { animation-name:pink-drift; }
    body[data-theme="turquoise"] .screen-ambience::before { animation-name:turquoise-wave; }
    body[data-theme="emerald"] .screen-ambience::before { animation-name:emerald-bloom; }
    body[data-theme="lime"] .screen-ambience::before { animation-name:lime-pulse; }
    body.celebrating .screen-ambience::after { animation:global-light-burst 1s ease-out; }
    body.major-celebration .screen-ambience::after { animation:global-light-burst 1.6s cubic-bezier(.12,.74,.12,1) both; }
    .flame-stage.ignite .fire-scale { animation:ignite-flame .92s cubic-bezier(.18,.78,.22,1); }
    .flame-stage.milestone .fire-scale { animation:milestone-flame 1.35s cubic-bezier(.18,.78,.22,1); }
    .flame-stage.milestone::before { animation:milestone-glow 1.35s ease-out; }
    .flame-stage.milestone::after { animation:halo-awaken 1.35s ease-out; }
    .burst-layer { position:absolute; inset:0; z-index:3; overflow:visible; pointer-events:none; }
    .burst-particle { position:absolute; left:var(--x); top:var(--y); width:var(--size); height:var(--size); border-radius:50%; background:var(--particle-color,var(--flame-core)); box-shadow:0 0 7px color-mix(in srgb,var(--particle-color,var(--flame-core)) 70%,transparent); opacity:0; animation:particle-burst var(--duration,.95s) cubic-bezier(.16,.76,.25,1) forwards; }
    .burst-particle.star { border-radius:1px; clip-path:polygon(50% 0,61% 36%,100% 50%,61% 64%,50% 100%,39% 64%,0 50%,39% 36%); }
    .burst-ring { position:absolute; left:50%; top:78%; width:16px; height:10px; border:1.5px solid var(--flame-mid); border-radius:50%; opacity:0; transform:translate(-50%,-50%) scale(.15); animation:ring-burst 1s cubic-bezier(.2,.7,.25,1) forwards; }
    .burst-ring.ring-two { width:24px; height:15px; border-style:dashed; animation-delay:.12s; }
    .burst-ring.ring-three { width:35px; height:22px; border-width:1px; border-style:dotted; animation-delay:.24s; }
    @keyframes screen-ambience-breathe { 0%,100% { transform:scale(1) translateY(0); opacity:.8 } 50% { transform:scale(1.06) translateY(-.8%); opacity:1 } }
    @keyframes white-aura { 0%,100% { transform:scale(.99); opacity:.6 } 50% { transform:scale(1.08); opacity:1 } }
    @keyframes emerald-bloom { 0%,100% { transform:scale(.98) translateY(.3%); opacity:.7 } 50% { transform:scale(1.08) translateY(-.4%); opacity:1 } }
    @keyframes golden-bloom { 0%,100% { transform:scale(.97); opacity:.74; filter:brightness(1) } 48% { transform:scale(1.07); opacity:1; filter:brightness(1.08) } }
    @keyframes pink-drift { 0%,100% { transform:scale(1) translateX(-.4%); opacity:.78 } 50% { transform:scale(1.07) translateX(.4%); opacity:1 } }
    @keyframes turquoise-wave { 0%,100% { transform:scale(.99) translateY(.4%); opacity:.78 } 50% { transform:scale(1.07) translateY(-.5%); opacity:1 } }
    @keyframes lime-pulse { 0%,100% { transform:scale(.97); opacity:.72 } 50% { transform:scale(1.06); opacity:1 } }
    @keyframes global-light-burst { 0% { opacity:.12 } 20% { opacity:.95 } 58% { opacity:.62 } 100% { opacity:.25 } }
    @keyframes red-ambient { 0%,100% { transform:scale(.98); opacity:.7 } 50% { transform:scale(1.08); opacity:1 } }
    @keyframes violet-ambient { 0%,100% { transform:scale(.95) rotate(-2deg); opacity:.74 } 50% { transform:scale(1.07) rotate(2deg); opacity:1 } }
    @keyframes ground-halo { 0%,100% { transform:perspective(180px) rotateX(58deg) scale(.94); opacity:.2 } 50% { transform:perspective(180px) rotateX(58deg) scale(1.08); opacity:.42 } }
    @keyframes flame-sway { 0%,100% { transform:skewX(-1deg) scaleX(.99) scaleY(1) } 33% { transform:skewX(1.5deg) scaleX(1.018) scaleY(1.014) } 68% { transform:skewX(-.8deg) scaleX(.986) scaleY(.987) } }
    @keyframes lick-left { 0%,100% { transform:rotate(-3deg) scaleY(.96) translateX(-1px) } 45% { transform:rotate(2deg) scaleY(1.045) translateX(2px) } 72% { transform:rotate(-1deg) scaleY(1.01) translateX(0) } }
    @keyframes lick-right { 0%,100% { transform:rotate(3deg) scaleY(1.02) translateX(1px) } 38% { transform:rotate(-4deg) scaleY(.92) translateX(-2px) } 72% { transform:rotate(1deg) scaleY(1.035) translateX(1px) } }
    @keyframes lick-middle { 0%,100% { transform:skewX(-1deg) scaleY(1) } 38% { transform:skewX(2.2deg) scaleY(1.065) } 72% { transform:skewX(-1.7deg) scaleY(.955) } }
    @keyframes core-flicker { 0%,100% { transform:scaleX(.97) scaleY(.985); opacity:.8 } 45% { transform:scaleX(1.045) scaleY(1.04); opacity:1 } }
    @keyframes hotspot { 0%,100% { transform:translate(0,0) scale(.86); opacity:.3 } 50% { transform:translate(1px,-4px) scale(1.12); opacity:.72 } }
    @keyframes ember-rise { 0% { transform:translate(0,0) scale(.45); opacity:0 } 14% { opacity:var(--spark-opacity) } 69% { opacity:calc(var(--spark-opacity)*.7) } 100% { transform:translate(var(--drift,5px),var(--rise,-55px)) scale(.12); opacity:0 } }
    @keyframes ignite-flame { 0% { transform:scale(calc(var(--fire-scale)*.97)) } 35% { transform:scale(calc(var(--fire-scale)*1.15)) } 66% { transform:scale(calc(var(--fire-scale)*.99)) } 100% { transform:scale(var(--fire-scale)) } }
    @keyframes milestone-flame { 0% { transform:scale(var(--fire-scale)) } 28% { transform:scale(calc(var(--fire-scale)*1.22)) } 54% { transform:scale(calc(var(--fire-scale)*.98)) } 100% { transform:scale(var(--fire-scale)) } }
    @keyframes milestone-glow { 0% { opacity:.62 } 28% { opacity:1 } 100% { opacity:.88 } }
    @keyframes halo-awaken { 0% { opacity:.2; transform:perspective(180px) rotateX(58deg) scale(.8) } 42% { opacity:.8; transform:perspective(180px) rotateX(58deg) scale(1.6) } 100% { opacity:.28; transform:perspective(180px) rotateX(58deg) scale(1) } }
    @keyframes particle-burst { 0% { opacity:0; transform:translate(-50%,-50%) scale(.25) } 14% { opacity:1 } 100% { opacity:0; transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.12) } }
    @keyframes ring-burst { 0% { opacity:.82; transform:translate(-50%,-50%) scale(.15) } 100% { opacity:0; transform:translate(-50%,-50%) scale(10) } }

    .counter { margin-top:-3px; display:flex; flex-direction:column; align-items:center; }
    .count { font-size:clamp(72px,19vw,94px); line-height:.98; font-weight:850; letter-spacing:-.065em; font-variant-numeric:tabular-nums; color:var(--flame); transition:color 1.1s; }
    .count-label { color:var(--flame-mid); font-weight:800; font-size:15px; letter-spacing:.035em; margin-top:7px; transition:color 1.1s; }
    .subtitle { color:var(--muted); font-size:13px; margin-top:12px; min-height:19px; }
    .main-button { position:relative; isolation:isolate; overflow:hidden; width:100%; border:0; min-height:58px; border-radius:18px; color:#17131e; background:linear-gradient(108deg,var(--flame-mid),var(--flame-core) 52%,var(--flame-mid)); background-size:200% 100%; font:800 16px/1 system-ui,sans-serif; margin-top:25px; box-shadow:0 7px 25px color-mix(in srgb,var(--flame) 18%,transparent),inset 0 1px 0 #ffffff62; cursor:pointer; transition:transform .14s,filter .25s,box-shadow .5s,background-position .7s; }
    .main-button::before { content:""; position:absolute; z-index:-1; width:12px;height:12px;left:var(--tap-x,50%);top:var(--tap-y,50%);border-radius:50%;background:#fff;opacity:0;transform:translate(-50%,-50%) scale(1); }
    .main-button::after { content:"";position:absolute;inset:-80% -40%;background:linear-gradient(110deg,transparent 38%,#ffffff70 48%,#ffffff08 54%,transparent 63%);transform:translateX(-70%) rotate(8deg);opacity:0;pointer-events:none; }
    .main-button:active { transform:scale(.975); filter:brightness(1.08); }
    .main-button.ignite { animation:button-ignite .66s cubic-bezier(.16,.85,.3,1);box-shadow:0 0 0 1px color-mix(in srgb,var(--flame) 42%,transparent),0 0 26px color-mix(in srgb,var(--flame) 34%,transparent),inset 0 1px 0 #ffffff86;background-position:100% 50%; }
    .main-button.ignite::before { animation:button-ripple .62s ease-out; }
    .main-button.ignite::after { opacity:1;animation:button-sweep .7s ease-out; }
    @keyframes button-ignite { 0%{transform:scale(1)} 22%{transform:scale(.965)} 48%{transform:scale(1.022)} 72%{transform:scale(.995)} 100%{transform:scale(1)} }
    @keyframes button-ripple { 0%{opacity:.55;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) scale(25)} }
    @keyframes button-sweep { 0%{transform:translateX(-70%) rotate(8deg)} 100%{transform:translateX(70%) rotate(8deg)} }
    .count.pop { animation:count-pop .5s cubic-bezier(.18,.9,.25,1.2); }
    @keyframes count-pop { 0%{transform:translateY(5px) scale(.8)} 48%{transform:translateY(-3px) scale(1.1);filter:brightness(1.35)} 100%{transform:translateY(0) scale(1);filter:brightness(1)} }
    .main-button:focus-visible { outline:3px solid #fff;outline-offset:3px; }
    .main-button.done { filter:saturate(.68); opacity:.88; cursor:default; box-shadow:0 5px 16px color-mix(in srgb,var(--flame) 12%,transparent); }
    .main-button:disabled { cursor:default; }
    .main-button.done:active { transform:none; filter:saturate(.68); }
    .section { margin-top:30px; }
    .section-head { display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:13px; }
    .section-title { color:#e5e1ed;font-size:13px;font-weight:800;letter-spacing:.09em; }
    .section-note { color:var(--muted);font-size:11px; }
    .month-toggle { width:100%;border:1px solid var(--line);border-radius:14px;background:rgba(27,26,35,.8);color:#e5e1ed;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;font:800 13px/1 system-ui,sans-serif;letter-spacing:.09em;cursor:pointer; }
    .month-toggle-side { display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:0; }
    .chevron { width:18px;height:18px;transition:transform .2s ease; }
    .month-toggle[aria-expanded="true"] .chevron { transform:rotate(180deg); }
    .month-panel { margin-top:10px;animation:panel-in .2s ease-out; }
    .month-panel[hidden] { display:none; }
    @keyframes panel-in { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
    .week { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px; }
    .day { display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0; }
    .day-name { font-size:11px;color:var(--muted);font-weight:700; }
    .day-dot { width:34px;height:34px;max-width:100%;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:#5e596b;font-size:14px;font-weight:800; }
    .day-dot.completed { color:#121018;background:var(--flame-mid);border-color:transparent;box-shadow:0 2px 10px color-mix(in srgb,var(--flame) 18%,transparent); }
    .day-dot.today { border:1.5px solid var(--flame);color:var(--text); }
    .day-dot.today.completed { color:#121018; }
    .month-card { padding:15px 14px 16px;background:linear-gradient(145deg,#1b1a23,#17161c);border:1px solid #292732;border-radius:20px; }
    .month-grid { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 5px; }
    .month-weekday { color:#716c7d;text-align:center;font-size:10px;font-weight:800;padding-bottom:4px; }
    .date-cell { aspect-ratio:1;min-width:0;display:grid;place-items:center;position:relative;font-size:11px;font-weight:650;color:#aaa5b4;border-radius:9px;background:#24222b; }
    .date-cell.empty { background:transparent; }
    .date-cell.complete { color:#16121a;background:var(--flame-mid); }
    .date-cell.today { outline:1px solid var(--flame);outline-offset:1px; }
    .legend { display:flex;justify-content:center;gap:14px;color:var(--muted);font-size:10px;margin-top:12px; }
    .legend span { display:flex;align-items:center;gap:5px; }
    .legend i { display:inline-block;width:7px;height:7px;border-radius:3px;background:var(--flame-mid); }
    .legend .empty-key { background:#302d38; }
    .extinguished[hidden] { display:none; }
    .extinguished { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:24px; background:#030305; min-height:100dvh; }
    .reignite-button { width:min(100%,320px); min-height:60px; border:1px solid #373440; border-radius:18px; background:linear-gradient(140deg,#17151d,#0c0b10); color:#f2edf8; font:800 16px/1 system-ui,sans-serif; letter-spacing:.01em; box-shadow:0 0 0 1px #ffffff05,inset 0 1px 0 #ffffff10; cursor:pointer; transition:transform .22s ease,border-color .5s ease,box-shadow .5s ease,background .5s ease; }
    .reignite-button:active { transform:scale(.97); border-color:#8f879b; box-shadow:0 0 32px #b3a6d020; }
    .reignite-button:focus-visible { outline:2px solid #f4eefb; outline-offset:4px; }
    body.is-extinguished { background:#030305 !important; }
    body.is-extinguished .screen-ambience, body.is-extinguished .app { display:none !important; }
    @media (max-height:800px) { .flame-stage { height:clamp(190px,34vh,244px); } .hero { padding-top:0; } .section { margin-top:24px; } }
    @media (prefers-reduced-motion:reduce) { .flame-waver { animation-duration:4.5s; } .flame-left { animation-duration:3.8s; } .flame-right { animation-duration:4.3s; } .flame-middle { animation-duration:3.6s; } .flame-core { animation-duration:3s; } .spark { animation-duration:4.5s; } .screen-ambience::before { animation-duration:12s; } .main-button::after { display:none; } }

<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'alev-serisi-v1';
  const MAJOR_MILESTONES = [50,105,180,225,245];
  const stages = [
    {name:'Mavi Kıvılcım',color:'#36b9ff',mid:'#9ae8ff',core:'#f8ffff',ambient:'#168dff',theme:'blue'},
    {name:'Hafif Turuncu',color:'#ffb267',mid:'#ffdab0',core:'#fff8e8',ambient:'#e68a3a',theme:'orange'},
    {name:'Kızıl Kor',color:'#ff405b',mid:'#ff9aaa',core:'#ffe9ee',ambient:'#d91f42',theme:'red'},
    {name:'Beyaz Alev',color:'#edf8ff',mid:'#ffffff',core:'#ffffff',ambient:'#91c8ff',theme:'white'},
    {name:'Mor Nebula',color:'#b58aff',mid:'#dfc3ff',core:'#fff6ff',ambient:'#7037d5',theme:'purple'},
    {name:'Zümrüt Ateşi',color:'#38e0a5',mid:'#a8ffe0',core:'#f3fff9',ambient:'#087d67',theme:'emerald'},
    {name:'Altın Güneş',color:'#ffd34e',mid:'#fff0a1',core:'#fffdf0',ambient:'#b97913',theme:'gold'},
    {name:'Pembe Nebula',color:'#ff6dc8',mid:'#ffc2ea',core:'#fff7fc',ambient:'#b82a83',theme:'pink'},
    {name:'Turkuaz Dalga',color:'#32e6d2',mid:'#b1fff5',core:'#f4fffd',ambient:'#087e94',theme:'turquoise'},
    {name:'Yeşil Aurora',color:'#b8f15e',mid:'#e8ffae',core:'#fbffe9',ambient:'#527e25',theme:'lime'}
  ];
  // Renk değişimleri: 5, ardından 10, 15 ... 45 günlük aralıklarla. Son renk 225. günde başlar; alev 245. günde tam boyuna ulaşır.
  const JOURNEY_END=245;
  const milestones=[5,15,30,50,75,105,140,180,225];
  const $=id=>document.getElementById(id);
  const root=document.documentElement;
  let data=loadData();
  function loadData(){
    try { const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); return {
      count:Number.isFinite(saved.count)?Math.max(0,Math.floor(saved.count)):0,
      lastDate:typeof saved.lastDate==='string'?saved.lastDate:null,
      completed:Array.isArray(saved.completed)?saved.completed.filter(x=>typeof x==='string' && /^\d{4}-\d{2}-\d{2}$/.test(x)).slice(-500):[]
    }; } catch { return {count:0,lastDate:null,completed:[]}; }
  }
  function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch{}}
  function dateKey(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
  function fromKey(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d,12,0,0,0);}
  function dayDifference(a,b){return Math.round((fromKey(b).getTime()-fromKey(a).getTime())/86400000);}
  function todayKey(){return dateKey(new Date());}
  function missedDay(){
    if(!data.lastDate || data.count<1) return false;
    return dayDifference(data.lastDate,todayKey())>1;
  }
  function currentCount(){
    if(!data.lastDate)return 0;
    const diff=dayDifference(data.lastDate,todayKey());
    return (diff===0||diff===1)?data.count:0;
  }
  function getStage(count){
    const safe=Math.max(0,Math.min(JOURNEY_END,count));let index=0;
    while(index<milestones.length&&safe>=milestones[index])index++;
    const start=index===0?0:milestones[index-1];
    const end=index<milestones.length?milestones[index]:JOURNEY_END;
    const progress=Math.max(0,Math.min(1,(safe-start)/Math.max(1,end-start)));
    const daysToChange=index<milestones.length?Math.max(0,milestones[index]-safe):Math.max(0,JOURNEY_END-safe);
    return {index,progress,daysToChange};
  }
  function setTheme(count){
    const state=getStage(count),stage=stages[state.index];
    root.style.setProperty('--flame',stage.color);
    root.style.setProperty('--flame-mid',stage.mid);
    root.style.setProperty('--flame-core',stage.core);
    root.style.setProperty('--ambient',stage.ambient);
    document.body.dataset.theme=stage.theme;
    $('flameStage').dataset.theme=stage.theme;
    const progress=Math.min(count,JOURNEY_END)/JOURNEY_END;
    const scale=.46+.74*Math.pow(progress,.60);
    root.style.setProperty('--fire-scale',scale.toFixed(4));
    root.style.setProperty('--fire-glow',(0.26+progress*.64).toFixed(2));
    root.style.setProperty('--spark-opacity',(0.38+progress*.62).toFixed(2));
    root.style.setProperty('--ambient-opacity',(0.16+0.66*Math.pow(progress,.68)).toFixed(2));
    $('flameStage').style.setProperty('--stage-boost',progress.toFixed(3));
    $('flameStage').style.setProperty('--stage-glow',(0.28+progress*.6).toFixed(2));
    $('flameStage').style.setProperty('--halo-opacity',(0.10+progress*.38).toFixed(2));
    $('flameStage').dataset.level=count<15?'spark':count<75?'ember':count<140?'blaze':count<225?'inferno':'legend';
    syncFireSparks(count);
    $('countLabel').textContent=count>JOURNEY_END?'SERİN DEVAM EDİYOR':count===JOURNEY_END?'ALEVİN SON AŞAMASI':'GÜNLÜK SERİ';
    const completedToday=data.lastDate===todayKey();
    const button=$('continueButton');
    button.classList.toggle('done',completedToday);
    button.disabled=completedToday;
    button.textContent=completedToday?'Bugün tamamlandı ✓':'Serimi devam ettir';
    let msg;
    if(count===0) msg='İlk alevini yak.';
    else if(count>=JOURNEY_END) msg=completedToday?'Bugünkü serin tamam. Yarın yeniden gel. 🔥':'Alevin en büyük hâlinde. Serin devam ediyor! 🔥';
    else if(completedToday && state.index<milestones.length) msg=state.daysToChange===1?'Bugünkü serin tamam. Yarın alevin renk değiştirecek. 🔥':`Bugünkü serin tamam. ${state.daysToChange} gün sonra yeni renk. 🔥`;
    else if(completedToday) msg=state.daysToChange===1?'Bugünkü serin tamam. Yarın son boyutuna ulaşacak. 🔥':`Bugünkü serin tamam. ${state.daysToChange} gün sonra son boyutuna ulaşacak. 🔥`;
    else if(state.index<milestones.length) msg=`${stage.name} · ${state.daysToChange} gün sonra renk değişimi`;
    else msg=`${stage.name} · ${state.daysToChange} gün sonra son boyut`;
    $('subtitle').textContent=msg;
  }
  function syncFireSparks(count){
    const group=$('dynamicSparks');
    const progress=Math.min(count,JOURNEY_END)/JOURNEY_END;
    const wanted=Math.round(3+19*Math.pow(progress,.72));
    if(Number(group.dataset.count)===wanted)return;
    group.replaceChildren();
    const svgNS='http://www.w3.org/2000/svg';
    for(let i=0;i<wanted;i++){
      const spark=document.createElementNS(svgNS,'circle');
      spark.classList.add('spark','dynamic-spark');
      const spread=12+progress*57;
      const cx=160+(Math.random()-.5)*spread*2;
      const cy=226-Math.random()*(28+progress*150);
      const duration=2.15+Math.random()*1.8-progress*.24;
      spark.setAttribute('cx',cx.toFixed(1));spark.setAttribute('cy',cy.toFixed(1));
      spark.setAttribute('r',(0.65+Math.random()*(.75+progress*.9)).toFixed(2));
      spark.style.setProperty('--duration',`${Math.max(1.4,duration).toFixed(2)}s`);
      spark.style.setProperty('--delay',`${(-Math.random()*3.5).toFixed(2)}s`);
      spark.style.setProperty('--rise',`${-(18+Math.random()*(24+progress*65)).toFixed(1)}px`);
      spark.style.setProperty('--drift',`${((Math.random()-.5)*(12+progress*30)).toFixed(1)}px`);
      group.append(spark);
    }
    group.dataset.count=String(wanted);
  }
  function renderWeek(){
    const container=$('week');container.innerHTML='';const today=new Date();today.setHours(12,0,0,0);
    const monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));
    const names=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
    for(let i=0;i<7;i++){
      const date=new Date(monday);date.setDate(monday.getDate()+i);const key=dateKey(date);const completed=data.completed.includes(key);const isToday=key===todayKey();
      const item=document.createElement('div');item.className='day';const name=document.createElement('div');name.className='day-name';name.textContent=names[i];
      const dot=document.createElement('div');dot.className='day-dot'+(completed?' completed':'')+(isToday?' today':'');dot.textContent=completed?'✓':String(date.getDate());item.append(name,dot);container.append(item);
    }
    const total=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return data.completed.includes(dateKey(d));}).filter(Boolean).length;
    $('weekNote').textContent=`${total}/7 gün`;
  }
  function renderMonth(){
    const now=new Date();const year=now.getFullYear(),month=now.getMonth();
    $('monthLabel').textContent=new Intl.DateTimeFormat('tr-TR',{month:'long',year:'numeric'}).format(now);
    const grid=$('monthGrid');grid.innerHTML='';
    ['P','S','Ç','P','C','C','P'].forEach(label=>{const el=document.createElement('div');el.className='month-weekday';el.textContent=label;grid.append(el);});
    const firstDay=new Date(year,month,1,12);const offset=(firstDay.getDay()+6)%7;const totalDays=new Date(year,month+1,0).getDate();
    for(let i=0;i<offset;i++){const blank=document.createElement('div');blank.className='date-cell empty';grid.append(blank);}
    for(let day=1;day<=totalDays;day++){const date=new Date(year,month,day,12);const key=dateKey(date);const el=document.createElement('div');el.className='date-cell'+(data.completed.includes(key)?' complete':'')+(key===todayKey()?' today':'');el.textContent=String(day);grid.append(el);}
  }
  function render(){
    const expired=missedDay();
    $('app').hidden=expired;
    $('extinguishedScreen').hidden=!expired;
    document.body.classList.toggle('is-extinguished',expired);
    if(expired){clearBurst();return;}
    const count=currentCount();
    $('count').textContent=String(count);
    setTheme(count);
    renderWeek();renderMonth();
  }

  let burstTimer=0;
  function clearBurst(){ if(burstTimer) clearTimeout(burstTimer); burstTimer=0; $('burstLayer').replaceChildren(); }
  let celebrationTimer=0;
  function flashAmbience(isMajor){
    if(celebrationTimer)clearTimeout(celebrationTimer);
    document.body.classList.remove('celebrating','major-celebration');
    void document.body.offsetWidth;
    document.body.classList.add(isMajor?'major-celebration':'celebrating');
    celebrationTimer=setTimeout(()=>{document.body.classList.remove('celebrating','major-celebration');celebrationTimer=0;},isMajor?1700:1100);
  }
  function makeBurst(isMilestone,count=currentCount()){
    clearBurst();
    const stage=$('flameStage'),layer=$('burstLayer'),rect=stage.getBoundingClientRect();
    const growth=Math.min(count,JOURNEY_END)/JOURNEY_END;
    const major=MAJOR_MILESTONES.includes(count);
    const total=(isMilestone?19:9)+Math.round(growth*17)+(major?10:0);
    const theme=stage.dataset.theme;
    const colorSets={
      blue:['#f7feff','#83e7ff','#39aaff'],orange:['#fff8e9','#ffd08a','#ff9846'],red:['#fff0f4','#ff8298','#ff3154'],
      white:['#ffffff','#e7f5ff','#a9d4ff'],purple:['#fff1ff','#d7b0ff','#9d63ff'],emerald:['#effff8','#9cffd8','#38e0a5'],
      gold:['#fffde8','#fff0a1','#ffd34e'],pink:['#fff3fc','#ffc2ea','#ff6dc8'],turquoise:['#f1fffc','#b1fff5','#32e6d2'],lime:['#fbffe8','#e8ffae','#b8f15e']
    };
    const colors=colorSets[theme]||['#ffffff','var(--flame-mid)','var(--flame)'];
    for(let i=0;i<total;i++){
      const particle=document.createElement('span');
      particle.className='burst-particle'+(isMilestone&&i%3===0?' star':'');
      const originX=rect.width/2+(Math.random()-.5)*Math.min(48,rect.width*.14);
      const originY=rect.height*.77+(Math.random()-.5)*12;
      const angle=-Math.PI*.94+Math.random()*Math.PI*.88;
      const distance=((isMilestone?60:34)+Math.random()*(isMilestone?68:44)+growth*45)*(major?1.18:1);
      particle.style.setProperty('--x',`${originX}px`);particle.style.setProperty('--y',`${originY}px`);
      particle.style.setProperty('--dx',`${Math.cos(angle)*distance}px`);particle.style.setProperty('--dy',`${Math.sin(angle)*distance}px`);
      particle.style.setProperty('--size',`${2+Math.random()*(isMilestone?4.4:2.4)+growth*1.4}px`);
      particle.style.setProperty('--duration',`${.68+Math.random()*(isMilestone?.75:.42)}s`);
      particle.style.setProperty('--particle-color',colors[Math.floor(Math.random()*colors.length)]);
      particle.style.animationDelay=`${Math.random()*.1}s`;layer.append(particle);
    }
    if(isMilestone){
      const ring=document.createElement('span');ring.className='burst-ring';layer.append(ring);
      if(major){const ring2=document.createElement('span');ring2.className='burst-ring ring-two';layer.append(ring2);}
      if(count>=225){const ring3=document.createElement('span');ring3.className='burst-ring ring-three';layer.append(ring3);}
    }
    const ttl=major?2300:isMilestone?1750:1250;
    burstTimer=setTimeout(()=>{layer.replaceChildren();burstTimer=0;},ttl);
    if(isMilestone)flashAmbience(major);
  }
  function replayButtonAnimation(event){
    const button=$('continueButton'),rect=button.getBoundingClientRect();
    if(event&&Number.isFinite(event.clientX)){button.style.setProperty('--tap-x',`${Math.max(0,Math.min(100,(event.clientX-rect.left)/rect.width*100))}%`);button.style.setProperty('--tap-y',`${Math.max(0,Math.min(100,(event.clientY-rect.top)/rect.height*100))}%`);}
    button.classList.remove('ignite');void button.offsetWidth;button.classList.add('ignite');
    $('count').classList.remove('pop');void $('count').offsetWidth;$('count').classList.add('pop');
    const flame=$('flameStage');flame.classList.remove('ignite','milestone');void flame.offsetWidth;flame.classList.add('ignite');
    setTimeout(()=>button.classList.remove('ignite'),1000);setTimeout(()=>flame.classList.remove('ignite','milestone'),1700);setTimeout(()=>$('count').classList.remove('pop'),700);
  }
  $('monthToggle').addEventListener('click',()=>{const btn=$('monthToggle'),open=btn.getAttribute('aria-expanded')==='true';btn.setAttribute('aria-expanded',String(!open));$('monthPanel').hidden=open;});
  function addCompletedDate(today){
    if(!data.completed.includes(today))data.completed.push(today);
    data.completed=data.completed.filter(key=>dayDifference(key,today)<=500).sort();
  }
  function igniteFreshStreak(){
    const today=todayKey();
    data.count=1;
    data.lastDate=today;
    addCompletedDate(today);
    saveData();
    render();
    replayButtonAnimation(null);
    makeBurst(false,1);
    $('flameStage').classList.add('ignite');
    setTimeout(()=>$('flameStage').classList.remove('ignite'),1100);
  }
  $('reigniteButton').addEventListener('click',igniteFreshStreak);
  $('continueButton').addEventListener('click',event=>{
    const today=todayKey();
    if(missedDay()){render();return;}
    if(data.lastDate===today)return;
    const previous=currentCount();
    const gap=data.lastDate?dayDifference(data.lastDate,today):null;
    data.count=(gap===1)?Math.max(1,data.count+1):1;
    data.lastDate=today;
    addCompletedDate(today);
    saveData();
    const next=data.count,previousStage=getStage(previous).index,nextStage=getStage(next).index;
    const milestone=nextStage!==previousStage||milestones.includes(next)||(next===JOURNEY_END&&previous<JOURNEY_END);
    render();
    replayButtonAnimation(event);
    makeBurst(milestone,next);
    if(milestone)$('flameStage').classList.add('milestone');
  });
  render();
  window.addEventListener('pageshow',render);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
  window.addEventListener('focus',render);
})();
</script>
</body>
</html>
